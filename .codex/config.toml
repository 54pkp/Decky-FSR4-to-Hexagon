# Project defaults; an explicit model selected in the app/CLI can override these.
# Keep machine-specific credentials, permissions and providers out of this file.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"
# Excludes the primary coordinator. Three slots are for development workers;
# the fourth lets review start if completed worker threads remain open.
# Actual host limits may be lower.
max_concurrent_threads_per_session = 4
