name: Windows public baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-baseline:
    name: Windows x64 / Python ${{ matrix.python-version }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.11", "3.12.10"]
    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select explicit CPython
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          check-latest: false
      - name: Install public baseline requirements
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' -m pip install --isolated --disable-pip-version-check -r tools/device/requirements-host.txt
      - name: Check public baseline dependencies
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' -m pip --isolated check
      - name: Run public baseline suite
        shell: pwsh
        run: |
          & '${{ steps.python.outputs.python-path }}' -m unittest discover -s tests -p "test_*.py" -v

# Scope: public Windows x64 host tests only. Verbose unittest output preserves
# capability skips as skips. ARM64, Linux, private SDK/assets, the ignored local
# multi-venv matrix (including its bundled/source-built Python 3.12.14), HTP,
# devices, and games remain not_run. The public matrix uses the final Windows
# binary-installer patches on the supported 3.10 and 3.12 lines.
